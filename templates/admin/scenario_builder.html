{% extends "admin/admin_base.html" %}

{% block title %}Scenario Builder{% endblock %}
{% block breadcrumb %}Scenario Builder{% endblock %}

{% block content %}
<style>
    .builder-container {
        display: flex;
        height: calc(100vh - 180px); /* Adjust based on header/footer */
        gap: 20px;
    }

    /* Sidebar List */
    .node-list-panel {
        width: 300px;
        background: white;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        border: 1px solid #e2e8f0;
        overflow: hidden;
    }

    .panel-header {
        padding: 15px;
        background: #f8f9fa;
        border-bottom: 1px solid #e2e8f0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: bold;
        color: #2d3748;
    }

    .node-list {
        flex-grow: 1;
        overflow-y: auto;
        padding: 10px;
    }

    .node-item {
        padding: 10px;
        margin-bottom: 5px;
        background: #f1f5f9;
        border-radius: 4px;
        cursor: pointer;
        border: 1px solid transparent;
        transition: all 0.2s;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .node-item:hover {
        background: #e2e8f0;
    }

    .node-item.active {
        background: #ebf8ff;
        border-color: #3498db;
        color: #2c5282;
    }

    /* Main Editor Area */
    .editor-panel {
        flex-grow: 1;
        background: white;
        border-radius: 8px;
        border: 1px solid #e2e8f0;
        padding: 20px;
        overflow-y: auto;
        display: none; /* Hidden until a node is selected */
    }

    .editor-panel.active {
        display: block;
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: 500;
        color: #4a5568;
    }

    .form-control {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid #cbd5e0;
        border-radius: 4px;
        font-size: 0.95rem;
    }

    textarea.form-control {
        min-height: 100px;
        resize: vertical;
    }

    /* Choices Section */
    .choices-container {
        border: 1px solid #e2e8f0;
        border-radius: 4px;
        padding: 15px;
        background: #f8fafc;
    }

    .choice-item {
        background: white;
        border: 1px solid #cbd5e0;
        padding: 10px;
        border-radius: 4px;
        margin-bottom: 10px;
        display: grid;
        grid-template-columns: 1fr 1fr 50px;
        gap: 10px;
        align-items: end;
    }

    .btn {
        padding: 8px 16px;
        border-radius: 4px;
        border: none;
        cursor: pointer;
        font-size: 0.9rem;
        transition: background 0.2s;
    }

    .btn-primary { background: #3498db; color: white; }
    .btn-primary:hover { background: #2980b9; }
    
    .btn-success { background: #2ecc71; color: white; }
    .btn-success:hover { background: #27ae60; }

    .btn-danger { background: #e74c3c; color: white; }
    .btn-danger:hover { background: #c0392b; }

    .btn-sm { padding: 4px 8px; font-size: 0.8rem; }

    .toolbar {
        margin-bottom: 20px;
        display: flex;
        gap: 10px;
        justify-content: flex-end;
    }
</style>

<div class="toolbar">
    <input type="text" id="filenameInput" class="form-control" placeholder="scenario_name.json" style="width: 250px;" value="new_scenario.json">
    <button class="btn btn-success" onclick="saveScenario()">
        <i class="fas fa-save"></i> Save Scenario
    </button>
</div>

<div class="builder-container">
    <!-- Sidebar: Node List -->
    <div class="node-list-panel">
        <div class="panel-header">
            <span>Scenes / Nodes</span>
            <button class="btn btn-primary btn-sm" onclick="addNode()">
                <i class="fas fa-plus"></i>
            </button>
        </div>
        <div class="node-list" id="nodeList">
            <!-- Node items injected by JS -->
        </div>
    </div>

    <!-- Main: Editor -->
    <div class="editor-panel" id="editorPanel">
        <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
            <h2 style="margin:0;">Edit Node</h2>
            <button class="btn btn-danger btn-sm" onclick="deleteCurrentNode()">Delete Node</button>
        </div>

        <div class="form-group">
            <label>Node ID (Unique)</label>
            <input type="text" id="nodeId" class="form-control" onchange="updateNodeId()">
        </div>

        <div class="form-group">
            <label>Title / Header</label>
            <input type="text" id="nodeTitle" class="form-control" oninput="updateCurrentNode('title', this.value)">
        </div>

        <div class="form-group">
            <label>Description (Main Text)</label>
            <textarea id="nodeDesc" class="form-control" oninput="updateCurrentNode('description', this.value)"></textarea>
        </div>

        <div class="form-group">
            <label>Image Filename (e.g., lab_fire.png)</label>
            <input type="text" id="nodeImage" class="form-control" oninput="updateCurrentNode('image', this.value)">
        </div>

        <div class="form-group">
            <label>Background Color (Hex)</label>
            <input type="color" id="nodeBg" style="width: 100px; height: 40px;" oninput="updateCurrentNode('background', this.value)">
        </div>

        <hr>

        <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <label style="margin:0">Choices / Buttons</label>
                <button class="btn btn-primary btn-sm" onclick="addChoice()">Add Choice</button>
            </div>
            
            <div id="choicesList" class="choices-container">
                <!-- Choices injected by JS -->
            </div>
        </div>
    </div>
</div>

<script>
    // State
    let scenarioData = {
        "start_node": "start",
        "nodes": [
            {
                "id": "start",
                "title": "Introduction",
                "description": "Welcome to the simulation.",
                "image": "",
                "choices": []
            }
        ]
    };
    
    let currentNodeId = null;

    // Initialization
    document.addEventListener('DOMContentLoaded', () => {
        renderNodeList();
    });

    // --- RENDER FUNCTIONS ---

    function renderNodeList() {
        const list = document.getElementById('nodeList');
        list.innerHTML = '';
        
        scenarioData.nodes.forEach(node => {
            const div = document.createElement('div');
            div.className = `node-item ${node.id === currentNodeId ? 'active' : ''}`;
            div.onclick = () => selectNode(node.id);
            div.innerHTML = `
                <span>
                    <strong>${node.id}</strong><br>
                    <small style="color:#666">${node.title || 'Untitled'}</small>
                </span>
                <i class="fas fa-chevron-right" style="color:#cbd5e0"></i>
            `;
            list.appendChild(div);
        });
    }

    function renderEditor() {
        const panel = document.getElementById('editorPanel');
        const node = scenarioData.nodes.find(n => n.id === currentNodeId);

        if (!node) {
            panel.classList.remove('active');
            return;
        }

        panel.classList.add('active');

        // Bind basic fields
        document.getElementById('nodeId').value = node.id;
        document.getElementById('nodeTitle').value = node.title || '';
        document.getElementById('nodeDesc').value = node.description || '';
        document.getElementById('nodeImage').value = node.image || '';
        document.getElementById('nodeBg').value = node.background || '#ffffff';

        // Render Choices
        const choicesList = document.getElementById('choicesList');
        choicesList.innerHTML = '';
        
        (node.choices || []).forEach((choice, index) => {
            const div = document.createElement('div');
            div.className = 'choice-item';
            div.innerHTML = `
                <div>
                    <small>Button Text</small>
                    <input type="text" class="form-control" value="${choice.text}" 
                        oninput="updateChoice(${index}, 'text', this.value)">
                </div>
                <div>
                    <small>Target Node ID</small>
                    <input type="text" class="form-control" value="${choice.next_node}" 
                        oninput="updateChoice(${index}, 'next_node', this.value)">
                </div>
                <button class="btn btn-danger btn-sm" onclick="removeChoice(${index})">
                    <i class="fas fa-trash"></i>
                </button>
            `;
            choicesList.appendChild(div);
        });
    }

    // --- LOGIC FUNCTIONS ---

    function selectNode(id) {
        currentNodeId = id;
        renderNodeList();
        renderEditor();
    }

    function addNode() {
        const id = 'node_' + Date.now().toString().slice(-4);
        scenarioData.nodes.push({
            id: id,
            title: "New Scene",
            description: "Describe what happens here...",
            choices: []
        });
        selectNode(id);
    }

    function deleteCurrentNode() {
        if (!confirm("Are you sure you want to delete this node?")) return;
        
        scenarioData.nodes = scenarioData.nodes.filter(n => n.id !== currentNodeId);
        currentNodeId = null;
        renderNodeList();
        renderEditor();
    }

    function updateNodeId() {
        const newId = document.getElementById('nodeId').value;
        if (!newId || newId === currentNodeId) return;

        // Check uniqueness
        if (scenarioData.nodes.find(n => n.id === newId)) {
            alert("Node ID must be unique!");
            document.getElementById('nodeId').value = currentNodeId;
            return;
        }

        // Update ID in the object
        const node = scenarioData.nodes.find(n => n.id === currentNodeId);
        node.id = newId;

        // Also update any choices in OTHER nodes pointing to this old ID? 
        // For simple MVP, we won't auto-refactor links, but it's a good future feature.
        
        currentNodeId = newId;
        renderNodeList();
    }

    function updateCurrentNode(field, value) {
        const node = scenarioData.nodes.find(n => n.id === currentNodeId);
        if (node) {
            node[field] = value;
            if (field === 'title') renderNodeList(); // Refresh list to show new title
        }
    }

    function addChoice() {
        const node = scenarioData.nodes.find(n => n.id === currentNodeId);
        if (!node) return;
        if (!node.choices) node.choices = [];
        
        node.choices.push({
            text: "Next Option",
            next_node: ""
        });
        renderEditor();
    }

    function removeChoice(index) {
        const node = scenarioData.nodes.find(n => n.id === currentNodeId);
        if (node && node.choices) {
            node.choices.splice(index, 1);
            renderEditor();
        }
    }

    function updateChoice(index, field, value) {
        const node = scenarioData.nodes.find(n => n.id === currentNodeId);
        if (node && node.choices[index]) {
            node.choices[index][field] = value;
        }
    }

    async function saveScenario() {
        const filename = document.getElementById('filenameInput').value;
        const btn = document.querySelector('button[onclick="saveScenario()"]');
        const originalText = btn.innerHTML;
        
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
        btn.disabled = true;

        try {
            const response = await fetch("{{ url_for('admin.save_scenario') }}", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    filename: filename,
                    content: scenarioData
                })
            });

            const result = await response.json();
            
            if (result.success) {
                alert(result.message);
            } else {
                alert("Error: " + result.message);
            }
        } catch (err) {
            alert("Network Error: " + err.message);
        } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    }
</script>
{% endblock %}
